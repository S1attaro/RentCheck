{% extends "base.html" %}
{% block title %}Delete lease{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Delete this report?</h1>
  <p>{{ object }}, started {{ object.lease_start|date:"M Y" }}</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="danger-btn">Delete</button>
    <a href="{% url 'leases:mine' %}" class="button secondary">Cancel</a>
  </form>
</section>
{% endblock %}
